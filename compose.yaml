# Joins the external `web` network, where the VPS's main Caddy proxies to it:
#   chinanki.bourdet.be { reverse_proxy chinanki:80 }
services:
  chinanki:
    build: .
    image: chinanki
    container_name: chinanki
    restart: unless-stopped
    networks: [web]

networks:
  web:
    external: true
